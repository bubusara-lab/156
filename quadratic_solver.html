<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Решение квадратных уравнений</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Unbounded:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #1a1a26;
    --border: #2a2a40;
    --accent: #7c5cfc;
    --accent2: #c084fc;
    --green: #4ade80;
    --red: #f87171;
    --yellow: #fbbf24;
    --text: #e8e8f0;
    --muted: #6666aa;
    --mono: 'JetBrains Mono', monospace;
    --head: 'Unbounded', sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px 80px;
  }

  /* Background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(124,92,252,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(124,92,252,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 700px;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 48px;
    animation: fadeDown 0.6s ease both;
  }
  .header-label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .header h1 {
    font-family: var(--head);
    font-size: clamp(22px, 5vw, 36px);
    font-weight: 900;
    line-height: 1.1;
    background: linear-gradient(135deg, #fff 30%, var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .equation-display {
    font-family: var(--mono);
    font-size: 18px;
    color: var(--muted);
    margin-top: 14px;
    letter-spacing: 1px;
  }
  .equation-display span { color: var(--accent2); }

  /* Card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    margin-bottom: 20px;
    animation: fadeUp 0.6s ease both;
  }
  .card:nth-child(2) { animation-delay: 0.1s; }
  .card:nth-child(3) { animation-delay: 0.2s; }

  .section-title {
    font-family: var(--head);
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  /* Coefficients */
  .coeff-row {
    display: flex;
    gap: 12px;
    align-items: flex-end;
  }
  .coeff-group {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .coeff-group label {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 1px;
  }
  .coeff-group label em {
    font-style: normal;
    color: var(--accent2);
    font-size: 15px;
    font-weight: 700;
  }
  .coeff-group input {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 700;
    text-align: center;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    width: 100%;
  }
  .coeff-group input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(124,92,252,0.15);
  }
  .coeff-group input::placeholder { color: var(--muted); font-size: 14px; }

  .coeff-sep {
    font-size: 20px;
    color: var(--muted);
    padding-bottom: 12px;
    flex-shrink: 0;
  }

  /* Toggle groups */
  .toggle-group {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .toggle-btn {
    flex: 1;
    min-width: 140px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
    line-height: 1.4;
    user-select: none;
  }
  .toggle-btn .btn-icon { font-size: 20px; display: block; margin-bottom: 6px; }
  .toggle-btn .btn-label { display: block; color: var(--text); font-weight: 700; font-size: 13px; }
  .toggle-btn .btn-desc { display: block; color: var(--muted); font-size: 11px; margin-top: 3px; }
  .toggle-btn:hover { border-color: var(--accent); color: var(--text); }
  .toggle-btn.active {
    border-color: var(--accent);
    background: rgba(124,92,252,0.15);
    box-shadow: 0 0 0 3px rgba(124,92,252,0.1);
  }
  .toggle-btn.active .btn-label { color: var(--accent2); }

  /* Solve button */
  .solve-btn {
    width: 100%;
    padding: 18px;
    background: var(--accent);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-family: var(--head);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .solve-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.1));
  }
  .solve-btn:hover { background: #6d4ef0; transform: translateY(-1px); box-shadow: 0 8px 24px rgba(124,92,252,0.35); }
  .solve-btn:active { transform: translateY(0); }

  /* Result */
  #result {
    display: none;
    animation: fadeUp 0.5s ease both;
  }

  .result-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }
  .result-badge {
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .badge-two { background: rgba(74,222,128,0.15); color: var(--green); border: 1px solid rgba(74,222,128,0.3); }
  .badge-one { background: rgba(251,191,36,0.15); color: var(--yellow); border: 1px solid rgba(251,191,36,0.3); }
  .badge-none { background: rgba(248,113,113,0.15); color: var(--red); border: 1px solid rgba(248,113,113,0.3); }

  /* Steps */
  .steps { display: flex; flex-direction: column; gap: 14px; }
  .step {
    background: var(--surface2);
    border-radius: 12px;
    padding: 16px 20px;
    border-left: 3px solid var(--accent);
    position: relative;
    animation: fadeLeft 0.4s ease both;
  }
  .step:nth-child(1) { animation-delay: 0.05s; border-color: var(--accent); }
  .step:nth-child(2) { animation-delay: 0.10s; border-color: var(--accent2); }
  .step:nth-child(3) { animation-delay: 0.15s; border-color: var(--yellow); }
  .step:nth-child(4) { animation-delay: 0.20s; border-color: var(--green); }

  .step-num {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .step-content {
    font-size: 14px;
    line-height: 1.7;
    color: var(--text);
  }
  .step-content .formula {
    font-size: 16px;
    color: var(--accent2);
    font-weight: 700;
    display: block;
    margin: 6px 0;
  }
  .step-content .value {
    color: var(--green);
    font-weight: 700;
  }
  .step-content .warn { color: var(--red); font-weight: 700; }
  .step-content .neutral { color: var(--yellow); font-weight: 700; }

  /* Answer box */
  .answer-box {
    background: rgba(124,92,252,0.1);
    border: 1px solid rgba(124,92,252,0.35);
    border-radius: 14px;
    padding: 22px 24px;
    text-align: center;
  }
  .answer-label {
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .answer-values {
    font-family: var(--head);
    font-size: clamp(20px, 5vw, 30px);
    font-weight: 900;
    color: var(--accent2);
    letter-spacing: 1px;
  }
  .answer-values.no-roots { color: var(--red); font-size: 18px; }

  /* Error */
  .error-msg {
    background: rgba(248,113,113,0.1);
    border: 1px solid rgba(248,113,113,0.3);
    border-radius: 10px;
    padding: 14px 18px;
    color: var(--red);
    font-size: 13px;
    display: none;
    margin-top: 12px;
  }

  /* Animations */
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeLeft {
    from { opacity: 0; transform: translateX(-12px); }
    to { opacity: 1; transform: translateX(0); }
  }

  hr.divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 20px 0;
  }
</style>
</head>
<body>

<div class="container">

  <!-- Header -->
  <div class="header">
    <div class="header-label">Калькулятор</div>
    <h1>Квадратные уравнения</h1>
    <div class="equation-display">
      <span>a</span>x² + <span>b</span>x + <span>c</span> = 0
    </div>
  </div>

  <!-- Coefficients -->
  <div class="card">
    <div class="section-title">// Коэффициенты</div>
    <div class="coeff-row">
      <div class="coeff-group">
        <label><em>a</em> — при x²</label>
        <input type="number" id="a" placeholder="напр. 1" step="any">
      </div>
      <div class="coeff-sep">·x² +</div>
      <div class="coeff-group">
        <label><em>b</em> — при x</label>
        <input type="number" id="b" placeholder="напр. -5" step="any">
      </div>
      <div class="coeff-sep">·x +</div>
      <div class="coeff-group">
        <label><em>c</em> — свободный</label>
        <input type="number" id="c" placeholder="напр. 6" step="any">
      </div>
    </div>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <!-- Method -->
  <div class="card">
    <div class="section-title">// Метод решения</div>
    <div class="toggle-group">
      <div class="toggle-btn active" onclick="selectMethod(this,'discriminant')">
        <span class="btn-icon">Δ</span>
        <span class="btn-label">Дискриминант</span>
        <span class="btn-desc">D = b² − 4ac</span>
      </div>
      <div class="toggle-btn" onclick="selectMethod(this,'vieta')">
        <span class="btn-icon">∑</span>
        <span class="btn-label">Теорема Виета</span>
        <span class="btn-desc">x₁+x₂ = −b/a, x₁·x₂ = c/a</span>
      </div>
    </div>
  </div>

  <!-- View mode -->
  <div class="card">
    <div class="section-title">// Режим просмотра</div>
    <div class="toggle-group">
      <div class="toggle-btn active" onclick="selectView(this,'answer')">
        <span class="btn-icon">✓</span>
        <span class="btn-label">Только ответ</span>
        <span class="btn-desc">Показать корни уравнения</span>
      </div>
      <div class="toggle-btn" onclick="selectView(this,'steps')">
        <span class="btn-icon">≡</span>
        <span class="btn-label">Ход решения</span>
        <span class="btn-desc">Пошаговое объяснение</span>
      </div>
    </div>
  </div>

  <!-- Button -->
  <button class="solve-btn" onclick="solve()">Решить уравнение →</button>

  <!-- Result -->
  <div id="result" class="card" style="margin-top:20px;">
    <div id="resultContent"></div>
  </div>

</div>

<script>
  var currentMethod = 'discriminant';
  var currentView = 'answer';

  function selectMethod(el, val) {
    document.querySelectorAll('.toggle-group')[0].querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    currentMethod = val;
  }

  function selectView(el, val) {
    document.querySelectorAll('.toggle-group')[1].querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    currentView = val;
  }

  function fmt(n) {
    var r = Math.round(n * 10000) / 10000;
    return r % 1 === 0 ? r.toString() : r.toString();
  }

  function solve() {
    var errEl = document.getElementById('errorMsg');
    errEl.style.display = 'none';

    var aVal = document.getElementById('a').value.trim();
    var bVal = document.getElementById('b').value.trim();
    var cVal = document.getElementById('c').value.trim();

    if (aVal === '' || bVal === '' || cVal === '') {
      errEl.textContent = '⚠ Пожалуйста, введите все три коэффициента a, b и c.';
      errEl.style.display = 'block';
      return;
    }

    var a = parseFloat(aVal), b = parseFloat(bVal), c = parseFloat(cVal);

    if (isNaN(a) || isNaN(b) || isNaN(c)) {
      errEl.textContent = '⚠ Коэффициенты должны быть числами.';
      errEl.style.display = 'block';
      return;
    }
    if (a === 0) {
      errEl.textContent = '⚠ Коэффициент a не может быть равен 0 — иначе это не квадратное уравнение.';
      errEl.style.display = 'block';
      return;
    }

    var html = '';

    if (currentMethod === 'discriminant') {
      html = solveDiscriminant(a, b, c);
    } else {
      html = solveVieta(a, b, c);
    }

    var resultEl = document.getElementById('result');
    document.getElementById('resultContent').innerHTML = html;
    resultEl.style.display = 'block';

    // re-trigger animation
    resultEl.style.animation = 'none';
    resultEl.offsetHeight;
    resultEl.style.animation = '';
  }

  function eqStr(a, b, c) {
    function part(coef, varStr, first) {
      if (coef === 0) return '';
      var sign = coef > 0 ? (first ? '' : ' + ') : (first ? '−' : ' − ');
      var abs = Math.abs(coef);
      return sign + (abs === 1 && varStr ? '' : abs) + varStr;
    }
    var s = part(a, 'x²', true) + part(b, 'x', !a) + part(c, '', !(a||b));
    return s || '0';
  }

  function solveDiscriminant(a, b, c) {
    var D = b * b - 4 * a * c;
    var eq = eqStr(a, b, c) + ' = 0';

    if (currentView === 'answer') {
      return answerOnly(a, b, c, D, 'discriminant');
    }

    // Steps
    var steps = '';

    // Step 1: уравнение
    steps += step(1, 'Запись уравнения',
      'Дано квадратное уравнение вида ax² + bx + c = 0:' +
      '<span class="formula">' + eq + '</span>' +
      'где a = <span class="value">' + fmt(a) + '</span>, b = <span class="value">' + fmt(b) + '</span>, c = <span class="value">' + fmt(c) + '</span>');

    // Step 2: дискриминант
    var Dcolor = D > 0 ? 'value' : (D === 0 ? 'neutral' : 'warn');
    steps += step(2, 'Вычисление дискриминанта',
      'Формула дискриминанта:' +
      '<span class="formula">D = b² − 4·a·c</span>' +
      'D = (' + fmt(b) + ')² − 4 · (' + fmt(a) + ') · (' + fmt(c) + ')' +
      '<br>D = ' + fmt(b*b) + ' − (' + fmt(4*a*c) + ')' +
      '<br>D = <span class="' + Dcolor + '">' + fmt(D) + '</span>');

    // Step 3: корни
    if (D > 0) {
      var sqrtD = Math.sqrt(D);
      var x1 = (-b + sqrtD) / (2 * a);
      var x2 = (-b - sqrtD) / (2 * a);
      steps += step(3, 'Нахождение корней',
        'D > 0, уравнение имеет два различных корня:' +
        '<span class="formula">x = (−b ± √D) / (2a)</span>' +
        'x₁ = (−(' + fmt(b) + ') + √' + fmt(D) + ') / (2 · ' + fmt(a) + ')' +
        '<br>x₁ = (' + fmt(-b) + ' + ' + fmt(Math.round(sqrtD*10000)/10000) + ') / ' + fmt(2*a) +
        '<br>x₁ = <span class="value">' + fmt(x1) + '</span>' +
        '<br><br>x₂ = (' + fmt(-b) + ' − ' + fmt(Math.round(sqrtD*10000)/10000) + ') / ' + fmt(2*a) +
        '<br>x₂ = <span class="value">' + fmt(x2) + '</span>');
      steps += answerBox('two', 'x₁ = ' + fmt(x1) + '&nbsp;&nbsp;&nbsp;x₂ = ' + fmt(x2));
    } else if (D === 0) {
      var x0 = -b / (2 * a);
      steps += step(3, 'Нахождение корня',
        'D = 0, уравнение имеет один корень (кратный):' +
        '<span class="formula">x = −b / (2a)</span>' +
        'x = −(' + fmt(b) + ') / (2 · ' + fmt(a) + ')' +
        '<br>x = <span class="neutral">' + fmt(x0) + '</span>');
      steps += answerBox('one', 'x = ' + fmt(x0));
    } else {
      steps += step(3, 'Анализ дискриминанта',
        'D < 0 — квадратный корень из отрицательного числа не существует в множестве вещественных чисел.' +
        '<br><br><span class="warn">Вещественных корней нет.</span>');
      steps += answerBox('none', 'Корней нет');
    }

    return badge(D) + '<hr class="divider"><div class="steps">' + steps + '</div>';
  }

  function solveVieta(a, b, c) {
    var D = b * b - 4 * a * c;

    // Теорема Виета применима только для a=1 классически, но обобщённая: x1+x2 = -b/a, x1*x2 = c/a
    if (currentView === 'answer') {
      return answerOnly(a, b, c, D, 'vieta');
    }

    var eq = eqStr(a, b, c) + ' = 0';
    var steps = '';

    // Приведённое уравнение
    var p = b / a, q = c / a;
    var eq2 = 'x² ' + (p >= 0 ? '+ ' + fmt(p) : '− ' + fmt(-p)) + 'x ' + (q >= 0 ? '+ ' + fmt(q) : '− ' + fmt(-q)) + ' = 0';

    steps += step(1, 'Запись уравнения',
      'Исходное уравнение:' +
      '<span class="formula">' + eq + '</span>' +
      'Делим все члены на a = <span class="value">' + fmt(a) + '</span>, получаем приведённое уравнение:' +
      '<span class="formula">' + eq2 + '</span>' +
      'p = b/a = <span class="value">' + fmt(p) + '</span>, q = c/a = <span class="value">' + fmt(q) + '</span>');

    steps += step(2, 'Условия теоремы Виета',
      'Если уравнение x² + px + q = 0 имеет корни x₁ и x₂, то по теореме Виета:' +
      '<span class="formula">x₁ + x₂ = −p = ' + fmt(-p) + '</span>' +
      '<span class="formula">x₁ · x₂ = q = ' + fmt(q) + '</span>');

    if (D < 0) {
      steps += step(3, 'Анализ',
        'Проверим дискриминант: D = b² − 4ac = ' + fmt(D) +
        '<br><span class="warn">D < 0 — вещественных корней нет. Теорема Виета неприменима.</span>');
      steps += answerBox('none', 'Корней нет');
    } else if (D === 0) {
      var x0 = -b / (2*a);
      steps += step(3, 'Нахождение корней',
        'D = 0, значит x₁ = x₂ = x₀ (кратный корень).' +
        '<br><br>Из условий Виета:' +
        '<br>x₁ + x₂ = 2x₀ = <span class="value">' + fmt(-p) + '</span>' +
        '<br>x₀ = <span class="value">' + fmt(x0) + '</span>' +
        '<br><br>Проверка: x₀ · x₀ = ' + fmt(x0*x0) + ' = q = <span class="value">' + fmt(q) + '</span> ✓');
      steps += answerBox('one', 'x = ' + fmt(x0));
    } else {
      var sqrtD = Math.sqrt(D);
      var x1 = (-b + sqrtD) / (2*a), x2 = (-b - sqrtD) / (2*a);
      steps += step(3, 'Нахождение корней',
        'Ищем два числа x₁ и x₂, такие что:' +
        '<span class="formula">x₁ + x₂ = ' + fmt(-p) + '</span>' +
        '<span class="formula">x₁ · x₂ = ' + fmt(q) + '</span>' +
        'Решая систему (через подстановку x₂ = ' + fmt(-p) + ' − x₁):' +
        '<br>x₁ · (' + fmt(-p) + ' − x₁) = ' + fmt(q) +
        '<br>Получаем: x₁ = <span class="value">' + fmt(x1) + '</span>, x₂ = <span class="value">' + fmt(x2) + '</span>' +
        '<br><br>Проверка по Виета:' +
        '<br>x₁ + x₂ = ' + fmt(Math.round((x1+x2)*10000)/10000) + ' = ' + fmt(-p) + ' ✓' +
        '<br>x₁ · x₂ = ' + fmt(Math.round((x1*x2)*10000)/10000) + ' = ' + fmt(q) + ' ✓');
      steps += answerBox('two', 'x₁ = ' + fmt(x1) + '&nbsp;&nbsp;&nbsp;x₂ = ' + fmt(x2));
    }

    return badge(D) + '<hr class="divider"><div class="steps">' + steps + '</div>';
  }

  function answerOnly(a, b, c, D, method) {
    var methodLabel = method === 'discriminant' ? 'Дискриминант' : 'Теорема Виета';
    var html = badge(D) + '<hr class="divider">';
    html += '<div style="text-align:center;margin-bottom:16px;font-size:12px;color:var(--muted);letter-spacing:2px;">МЕТОД: ' + methodLabel.toUpperCase() + '</div>';
    if (D > 0) {
      var sqrtD = Math.sqrt(D);
      var x1 = (-b + sqrtD) / (2*a), x2 = (-b - sqrtD) / (2*a);
      html += answerBox('two', 'x₁ = ' + fmt(x1) + '&nbsp;&nbsp;&nbsp;x₂ = ' + fmt(x2));
    } else if (D === 0) {
      html += answerBox('one', 'x = ' + fmt(-b / (2*a)));
    } else {
      html += answerBox('none', 'Вещественных корней нет');
    }
    return html;
  }

  function badge(D) {
    if (D > 0) return '<div class="result-header"><span class="section-title" style="margin:0;">Результат</span><span class="result-badge badge-two">2 корня</span></div>';
    if (D === 0) return '<div class="result-header"><span class="section-title" style="margin:0;">Результат</span><span class="result-badge badge-one">1 корень</span></div>';
    return '<div class="result-header"><span class="section-title" style="margin:0;">Результат</span><span class="result-badge badge-none">Нет корней</span></div>';
  }

  function step(n, title, content) {
    return '<div class="step"><div class="step-num">Шаг ' + n + ' — ' + title + '</div><div class="step-content">' + content + '</div></div>';
  }

  function answerBox(type, text) {
    var cls = type === 'two' ? 'badge-two' : type === 'one' ? 'badge-one' : 'badge-none';
    var valCls = type === 'none' ? 'answer-values no-roots' : 'answer-values';
    return '<div class="answer-box" style="margin-top:16px;"><div class="answer-label">Ответ</div><div class="' + valCls + '">' + text + '</div></div>';
  }
</script>
</body>
</html>
